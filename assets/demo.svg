<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">旅行素材管家：把一次旅行，收进一个文件夹</title>
  <desc id="desc">流程示意，使用虚构数据。选择旅行日期、勾选城市和实况照片模式，再经数据线复制并校验到旅行文件夹。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#eef8f6"/><stop offset="1" stop-color="#f8f4eb"/></linearGradient>
    <linearGradient id="brand" x2="1" y2="1"><stop stop-color="#135d5a"/><stop offset="1" stop-color="#083f43"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dy="14" stdDeviation="18" flood-color="#0e4240" flood-opacity=".09"/></filter>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#153e42}.muted{fill:#607c7c}.small{font-size:15px}.body{font-size:18px}.label{font-size:14px;font-weight:600;letter-spacing:1px}.heading{font-size:23px;font-weight:650}.white{fill:white}</style>
  </defs>
  <rect width="1280" height="720" rx="24" fill="url(#bg)"/>
  <circle cx="1185" cy="100" r="175" fill="#e1eee3" opacity=".5"/>
  <g transform="translate(64,47)">
    <rect width="45" height="45" rx="13" fill="url(#brand)"/>
    <path d="M10 18h10l4 4h12v14H10z" fill="#e9f5ef"/>
    <path d="M15 30l7-7 7 7" fill="none" stroke="#d9a255" stroke-width="3" stroke-linecap="round"/>
    <text x="60" y="30" font-size="23" font-weight="650">旅行素材管家</text>
    <text x="1150" y="29" text-anchor="end" class="label muted">macOS · OPEN SOURCE</text>
  </g>
  <text x="64" y="170" font-size="49" font-weight="680" letter-spacing="-1">把一次旅行，收进一个文件夹。</text>
  <text x="66" y="215" font-size="21" class="muted">选择日期与地点，整理 iPhone 的照片和视频。手机原件保持不变。</text>
  <g transform="translate(64,260)" filter="url(#shadow)">
    <rect width="1152" height="350" rx="20" fill="white"/>
    <path d="M20 0h1112a20 20 0 0 1 20 20v30H0V20A20 20 0 0 1 20 0" fill="#f5f8f7"/>
    <circle cx="24" cy="25" r="5" fill="#e0aba1"/><circle cx="42" cy="25" r="5" fill="#e8d09a"/><circle cx="60" cy="25" r="5" fill="#a9cdb6"/>
    <text x="576" y="31" text-anchor="middle" class="small muted">流程示意 · 虚构示例</text>
    <path d="M384 76v246M768 76v246" stroke="#e4ece8"/>
    <g transform="translate(28,82)">
      <text class="label muted" y="0">01 / 选择这次旅行</text>
      <text class="heading" y="42">一个名字，一段日期</text>
      <rect y="66" width="326" height="51" rx="9" fill="#f3f7f5"/>
      <text x="16" y="98" class="body">海边三日游</text>
      <rect y="128" width="326" height="51" rx="9" fill="#f3f7f5"/>
      <text x="16" y="160" class="body">2026.08.01 — 2026.08.03</text>
      <text y="218" class="small muted">连接 iPhone，扫描后再选择素材。</text>
    </g>
    <g transform="translate(412,82)">
      <text class="label muted" y="0">02 / 勾选地点与实况模式</text>
      <text class="heading" y="42">只整理这趟旅行</text>
      <rect y="72" width="21" height="21" rx="5" fill="#1e7468"/><path d="m5 82 4 4 7-8" fill="none" stroke="white" stroke-width="2"/>
      <text x="34" y="89" class="body">滨海市（示例）</text>
      <rect y="112" width="21" height="21" rx="5" fill="#1e7468"/><path d="m5 122 4 4 7-8" fill="none" stroke="white" stroke-width="2"/>
      <text x="34" y="129" class="body">山川市（示例）</text>
      <rect y="158" width="326" height="37" rx="9" fill="#edf4ef"/>
      <rect x="3" y="161" width="160" height="31" rx="7" fill="white"/>
      <text x="83" y="182" text-anchor="middle" class="small">完整实况照片</text>
      <text x="244" y="182" text-anchor="middle" class="small muted">仅静态照片</text>
      <text y="234" class="small muted">“位置未知”可展开后逐项选择。</text>
    </g>
    <g transform="translate(797,82)">
      <text class="label muted" y="0">03 / 数据线复制归档</text>
      <text class="heading" y="42">先复制，再统一校验</text>
      <path d="M0 87h44l12 13h264v84H0z" fill="#e7f0e4"/>
      <path d="M0 109h320v75H0z" fill="#d6e6cd"/>
      <text x="18" y="151" font-size="17" font-weight="600">2026-08-01_海边三日游</text>
      <text y="218" class="small muted">照片、配套短视频与独立视频。</text>
      <text y="244" class="small muted">复制和校验完成后，查看归档结果。</text>
    </g>
  </g>
  <text x="66" y="657" class="body" font-weight="550">USB 直连　 /　 原件不变　 /　 不依赖 iCloud</text>
  <text x="66" y="687" class="small muted">城市优先使用手机已有信息；缺失时可能通过 Apple 联网查询坐标。</text>
  <text x="1214" y="674" text-anchor="end" class="small muted">github.com/waton1990/travel-media-manager</text>
</svg>
